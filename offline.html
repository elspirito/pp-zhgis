<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нет сети — ПП-каталог рецептов</title>
<meta name="theme-color" content="#f7f3ea">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f3ea;
    --surface: #fffdf8;
    --ink: #202a24;
    --muted: #5d655c;
    --line: #e5ddcd;
    --green: #2f6b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111612;
      --surface: #1a221b;
      --ink: #f1ecdf;
      --muted: #a9b4a9;
      --line: #2b352c;
      --green: #7cc39a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(430px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 32px 26px 28px;
    text-align: center;
    box-shadow: 0 24px 60px -40px rgba(20, 28, 22, .55);
  }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 18px;
    border-radius: 19px;
    display: grid; place-items: center;
    background: var(--green);
    color: #f7f3ea;
    font: 700 24px/1 Georgia, "Times New Roman", serif;
  }
  h1 {
    margin: 0 0 10px;
    font: 600 30px/1.1 Georgia, "Iowan Old Style", serif;
    letter-spacing: -.02em;
  }
  p { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; }
  button, a.button {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 22px;
    border-radius: 14px; border: 1px solid transparent;
    background: var(--green); color: #fff;
    font: 600 15px/1 inherit; text-decoration: none; cursor: pointer;
    width: 100%;
  }
  a.link { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">ПП</div>
    <h1>Нет соединения</h1>
    <p>Рецепты уже сохранены на устройстве — откройте каталог, он работает офлайн. Совсем новые фото подгрузятся, когда появится сеть.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
    <a class="link" href="./">Открыть каталог офлайн</a>
  </div>
</body>
</html>
